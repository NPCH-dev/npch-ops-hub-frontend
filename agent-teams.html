<title>NPCH Agent Teams</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
:root {
  --bg: #080c14;
  --bg2: #0d1220;
  --bg3: #121828;
  --bg4: #18202f;
  --border: #1c2638;
  --border2: #253044;
  --fg: #dde4f0;
  --fg2: #8899b4;
  --fg3: #4d6080;
  --accent: #3b82f6;
  --accent2: #60a5fa;
  --accent-bg: rgba(59,130,246,0.1);
  --green: #10b981;
  --green-bg: rgba(16,185,129,0.1);
  --yellow: #f59e0b;
  --yellow-bg: rgba(245,158,11,0.1);
  --red: #ef4444;
  --red-bg: rgba(239,68,68,0.1);
  --purple: #8b5cf6;
  --purple-bg: rgba(139,92,246,0.1);
  --orange: #f97316;
  --orange-bg: rgba(249,115,22,0.1);
  --r: 10px; --r2: 6px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef2f8; --bg2: #ffffff; --bg3: #f5f8fd; --bg4: #e8edf7;
    --border: #d0d8e8; --border2: #b0bdd0; --fg: #0d1526; --fg2: #3d5068; --fg3: #7a92a8;
    --accent-bg: rgba(59,130,246,0.07); --green-bg: rgba(16,185,129,0.07);
    --yellow-bg: rgba(245,158,11,0.07); --red-bg: rgba(239,68,68,0.07);
    --purple-bg: rgba(139,92,246,0.07); --orange-bg: rgba(249,115,22,0.07);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef2f8; --bg2: #ffffff; --bg3: #f5f8fd; --bg4: #e8edf7;
  --border: #d0d8e8; --border2: #b0bdd0; --fg: #0d1526; --fg2: #3d5068; --fg3: #7a92a8;
  --accent-bg: rgba(59,130,246,0.07); --green-bg: rgba(16,185,129,0.07);
  --yellow-bg: rgba(245,158,11,0.07); --red-bg: rgba(239,68,68,0.07);
  --purple-bg: rgba(139,92,246,0.07); --orange-bg: rgba(249,115,22,0.07);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 14px; line-height: 1.5;
  min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left,0px));
  padding-right: max(16px, env(safe-area-inset-right,0px));
  padding-block: 0;
}

/* ── HEADER ── */
.header {
  position: sticky; top: env(safe-area-inset-top,0px); z-index: 100;
  background: var(--bg2); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 14px;
  padding: 0 24px; height: 56px;
}
body::before {
  content:""; position:fixed; inset:0 0 auto;
  height:env(safe-area-inset-top,0px); background:var(--bg2); z-index:101;
}
.logo { display:flex; align-items:center; gap:10px; }
.logo-mark {
  width:30px; height:30px; border-radius:8px;
  background:transparent;
  display:flex; align-items:center; justify-content:center; font-size:15px;
}
.logo-name { font-weight:700; font-size:15px; letter-spacing:-.3px; }
.logo-sep { width:1px; height:20px; background:var(--border2); }
.page-title { font-size:14px; color:var(--fg2); font-weight:500; }
.header-right { margin-left:auto; display:flex; align-items:center; gap:8px; }

/* ── LAYOUT ── */
.layout { display:flex; gap:0; height:calc(100vh - 56px); overflow:hidden; }

/* ── SIDEBAR: Teams ── */
.teams-panel {
  width:240px; min-width:240px;
  background:var(--bg2); border-right:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden;
}
.panel-header {
  padding:16px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:8px;
}
.panel-title { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.8px; color:var(--fg3); flex:1; }
.teams-list { flex:1; overflow-y:auto; padding:8px; }

.team-item {
  border-radius:var(--r2); border:1px solid transparent;
  margin-bottom:4px; cursor:pointer; transition:all .15s;
  overflow:hidden;
}
.team-item:hover { border-color:var(--border2); background:var(--bg4); }
.team-item.active { border-color:var(--accent); background:var(--accent-bg); }
.team-item-header { padding:11px 12px; display:flex; align-items:center; gap:10px; }
.team-color-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.team-item-name { font-size:13px; font-weight:500; flex:1; }
.team-item-count {
  font-size:11px; color:var(--fg3); background:var(--bg4);
  padding:1px 7px; border-radius:10px; border:1px solid var(--border);
}
.team-item.active .team-item-count { background:var(--accent-bg); border-color:var(--accent); color:var(--accent2); }
.team-item-sub { padding:0 12px 10px; font-size:11px; color:var(--fg3); display:none; }
.team-item.active .team-item-sub { display:block; }

/* ── MAIN: Agent List ── */
.agents-panel { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.agents-toolbar {
  padding:16px 20px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:10px; background:var(--bg2);
  flex-wrap:wrap;
}
.agents-toolbar-left { display:flex; align-items:center; gap:10px; flex:1; }
.team-heading { font-size:16px; font-weight:700; display:flex; align-items:center; gap:8px; }
.runtime-filter { display:flex; gap:4px; }
.filter-btn {
  padding:5px 11px; border-radius:var(--r2); font-size:12px; font-weight:500;
  cursor:pointer; border:1px solid var(--border2); background:transparent;
  color:var(--fg2); transition:all .15s;
}
.filter-btn.active { background:var(--accent-bg); border-color:var(--accent); color:var(--accent2); }
.filter-btn:hover:not(.active) { border-color:var(--fg3); color:var(--fg); }

.agents-list { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:10px; }

/* ── AGENT CARD ── */
.agent-card {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:var(--r); overflow:hidden;
  transition:border-color .15s, transform .1s;
  position:relative;
}
.agent-card:hover { border-color:var(--border2); }
.agent-card.selected { border-color:var(--accent); }
.agent-card-accent {
  position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--agent-col, var(--accent));
}

.agent-card-main { padding:14px 16px 14px 20px; display:flex; gap:14px; align-items:flex-start; }
.agent-emoji { font-size:28px; flex-shrink:0; line-height:1; padding-top:2px; }
.agent-info { flex:1; min-width:0; }
.agent-id-row { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
.agent-id { font-size:10px; font-weight:700; letter-spacing:1.5px; color:var(--fg3); font-family:'JetBrains Mono',monospace; }
.agent-name { font-size:15px; font-weight:600; margin-bottom:3px; }
.agent-role { font-size:12px; color:var(--fg2); margin-bottom:8px; }
.agent-desc { font-size:12px; color:var(--fg3); line-height:1.5; margin-bottom:10px; }

.agent-meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.meta-chip {
  display:inline-flex; align-items:center; gap:5px;
  font-size:11px; padding:3px 9px; border-radius:10px;
  border:1px solid var(--border2); color:var(--fg2); background:var(--bg3);
  font-family:'JetBrains Mono',monospace;
}
.meta-chip .dot { width:6px; height:6px; border-radius:50%; }

.agent-card-actions { display:flex; flex-direction:column; gap:6px; align-items:flex-end; padding-left:12px; flex-shrink:0; }

/* deployment status badge */
.dep-badge {
  display:inline-flex; align-items:center; gap:5px;
  font-size:11px; font-weight:600; padding:4px 10px; border-radius:var(--r2);
  white-space:nowrap;
}
.dep-badge.deployed { background:var(--green-bg); color:var(--green); border:1px solid rgba(16,185,129,.25); }
.dep-badge.pending  { background:var(--yellow-bg); color:var(--yellow); border:1px solid rgba(245,158,11,.25); }
.dep-badge.planned  { background:var(--bg4); color:var(--fg3); border:1px solid var(--border2); }
.dep-badge.local    { background:var(--purple-bg); color:var(--purple); border:1px solid rgba(139,92,246,.25); }

/* progress bar */
.agent-footer { padding:0 20px 12px 20px; }
.progress-row { display:flex; align-items:center; gap:10px; }
.progress-label { font-size:11px; color:var(--fg3); white-space:nowrap; }
.progress-bar { flex:1; height:3px; background:var(--bg4); border-radius:2px; overflow:hidden; }
.progress-fill { height:100%; border-radius:2px; background:var(--agent-col,var(--accent)); transition:width .6s ease; }
.progress-pct { font-size:11px; color:var(--fg3); font-family:'JetBrains Mono',monospace; white-space:nowrap; }

/* tags */
.tag-row { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
.tag { font-size:10px; padding:2px 7px; border-radius:8px; background:var(--bg4); color:var(--fg3); border:1px solid var(--border); }

/* ── DETAIL PANEL ── */
.detail-panel {
  width:340px; min-width:340px;
  background:var(--bg2); border-left:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden;
}
.detail-panel.hidden { display:none; }
.detail-scroll { flex:1; overflow-y:auto; padding:20px; }
.detail-close { background:none; border:none; color:var(--fg3); cursor:pointer; font-size:18px; padding:4px; }
.detail-close:hover { color:var(--fg); }

.detail-hero { text-align:center; padding:20px 0 16px; border-bottom:1px solid var(--border); margin-bottom:16px; }
.detail-emoji { font-size:48px; margin-bottom:8px; }
.detail-name { font-size:18px; font-weight:700; margin-bottom:4px; }
.detail-role { font-size:13px; color:var(--fg2); }

.detail-section { margin-bottom:20px; }
.detail-section-title { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.8px; color:var(--fg3); margin-bottom:10px; }

.kv-row { display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--border); font-size:13px; }
.kv-row:last-child { border-bottom:none; }
.kv-key { color:var(--fg3); }
.kv-val { font-weight:500; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--fg2); }

.prompt-preview {
  background:var(--bg3); border:1px solid var(--border);
  border-radius:var(--r2); padding:12px;
  font-family:'JetBrains Mono',monospace; font-size:11px;
  color:var(--fg2); line-height:1.6; max-height:160px;
  overflow-y:auto; white-space:pre-wrap;
}

.deploy-steps { display:flex; flex-direction:column; gap:6px; }
.deploy-step {
  display:flex; align-items:center; gap:10px; padding:9px 12px;
  border-radius:var(--r2); border:1px solid var(--border); background:var(--bg3);
  font-size:12px;
}
.deploy-step .step-icon { font-size:16px; flex-shrink:0; }
.deploy-step .step-text { flex:1; }
.deploy-step .step-status { font-size:11px; font-weight:600; }
.deploy-step.done .step-status { color:var(--green); }
.deploy-step.pending .step-status { color:var(--yellow); }
.deploy-step.todo .step-status { color:var(--fg3); }

/* ── Buttons ── */
.btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 14px; border-radius:var(--r2);
  font-size:13px; font-weight:500; cursor:pointer;
  border:1px solid var(--border2); background:var(--bg4); color:var(--fg2);
  font-family:inherit; transition:all .15s;
}
.btn:hover { border-color:var(--fg3); color:var(--fg); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.primary:hover { background:var(--accent2); }
.btn.sm { padding:5px 11px; font-size:12px; }
.btn.xs { padding:3px 9px; font-size:11px; }
.btn.danger { background:var(--red-bg); border-color:var(--red); color:var(--red); }
.btn.success { background:var(--green-bg); border-color:var(--green); color:var(--green); }

/* ── Modal ── */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:500; display:flex; align-items:center; justify-content:center; padding:20px; }
.overlay[hidden] { display:none; }
.modal { background:var(--bg2); border:1px solid var(--border2); border-radius:var(--r); width:100%; max-width:460px; }
.modal-head { padding:18px 20px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; }
.modal-title { font-size:15px; font-weight:600; flex:1; }
.modal-body { padding:20px; display:flex; flex-direction:column; gap:14px; }
.modal-foot { padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; }

.form-label { font-size:12px; font-weight:500; color:var(--fg2); display:block; margin-bottom:5px; }
.form-input, .form-select, .form-textarea {
  width:100%; background:var(--bg3); border:1px solid var(--border2);
  border-radius:var(--r2); padding:9px 12px; color:var(--fg);
  font-size:13px; font-family:inherit; outline:none; transition:border-color .15s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color:var(--accent); }
.form-textarea { resize:vertical; min-height:80px; }

/* ── Checklist ── */
.check-item {
  display:flex; align-items:center; gap:10px; padding:8px 12px;
  border-radius:var(--r2); cursor:pointer; transition:background .1s;
}
.check-item:hover { background:var(--bg4); }
.check-item input[type=checkbox] { accent-color:var(--accent); width:15px; height:15px; }

/* ── Stats bar ── */
.stats-bar {
  display:flex; gap:16px; padding:12px 20px;
  background:var(--bg3); border-bottom:1px solid var(--border);
  overflow-x:auto;
}
.stat-item { display:flex; align-items:center; gap:7px; white-space:nowrap; }
.stat-num { font-size:18px; font-weight:700; }
.stat-lbl { font-size:12px; color:var(--fg3); }
.stat-sep { width:1px; height:28px; background:var(--border2); flex-shrink:0; }

/* ── Toast ── */
.toasts { position:fixed; top:72px; right:16px; display:flex; flex-direction:column; gap:8px; z-index:999; }
.toast {
  background:var(--bg2); border:1px solid var(--border2);
  border-radius:var(--r2); padding:10px 14px;
  display:flex; align-items:center; gap:8px; font-size:13px;
  box-shadow:0 4px 24px rgba(0,0,0,.4); min-width:240px;
  animation:slideIn .2s ease;
}
@keyframes slideIn { from { transform:translateX(100%); opacity:0; } to { transform:none; opacity:1; } }

/* ── Empty state ── */
.empty { text-align:center; padding:60px 20px; color:var(--fg3); }
.empty-icon { font-size:48px; margin-bottom:12px; }
.empty-title { font-size:15px; font-weight:500; color:var(--fg2); margin-bottom:4px; }
.empty-sub { font-size:13px; }

/* Scrollbars */
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }

@media (max-width:900px) {
  .detail-panel { width:280px; min-width:280px; }
  .teams-panel { width:200px; min-width:200px; }
}
@media (max-width:640px) {
  .detail-panel { display:none; }
  .teams-panel { width:56px; min-width:56px; }
  .team-item-name, .team-item-sub, .team-item-count { display:none; }
}
</style>

// ═══════════════════════════════════════════════════════
// RENDER TEAMS
// ═══════════════════════════════════════════════════════
function renderTeams() {
  const el = document.getElementById('teams-list');
  el.innerHTML = TEAMS.map(t => {
    const agents = AGENTS.filter(a => t.agents.includes(a.id));
    const deployed = agents.filter(a => a.runtime === 'n8n').length;
    return `
    <div class="team-item ${STATE.activeTeam===t.id?'active':''}" onclick="selectTeam('${t.id}')">
      <div class="team-item-header">
        <div class="team-color-dot" style="background:${t.color}"></div>
        <span class="team-item-name">${esc(t.name)}</span>
        <span class="team-item-count">${agents.length}</span>
      </div>
      <div class="team-item-sub">${deployed}/${agents.length} auf n8n</div>

  }).join('') + `
  <div style="padding:12px 8px;">
    <button class="btn sm" style="width:100%;justify-content:center;" onclick="openNewTeamModal()">+ Team erstellen</button>

}

// ═══════════════════════════════════════════════════════
// SELECT TEAM
// ═══════════════════════════════════════════════════════
function selectTeam(id) {
  STATE.activeTeam = id;
  renderTeams();
  renderAgents();
  document.getElementById('assign-btn').style.display = '';
}

function setFilter(f, btn) {
  STATE.filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAgents();
}

// ═══════════════════════════════════════════════════════
// RENDER AGENTS
// ═══════════════════════════════════════════════════════
function renderAgents() {
  const team = TEAMS.find(t => t.id === STATE.activeTeam);
  const el = document.getElementById('agents-list');
  const heading = document.getElementById('active-team-heading');

  if (!team) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">👈</div><div class="empty-title">Team auswählen</div><div class="empty-sub">Wähle ein Team aus der linken Sidebar</div></div>`;
    heading.textContent = '— Kein Team —';
    return;
  }

  heading.innerHTML = `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${team.color};"></span> ${esc(team.name)} <span style="font-size:13px;font-weight:400;color:var(--fg3)">${esc(team.desc)}</span>`;

  let agents = AGENTS.filter(a => team.agents.includes(a.id));
  if (STATE.filter !== 'all') agents = agents.filter(a => a.runtime === STATE.filter);

  if (agents.length === 0) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">🤖</div><div class="empty-title">Keine Agenten</div><div class="empty-sub">${STATE.filter!=='all'?'Kein Agent mit diesem Filter.':'Noch keine Agenten in diesem Team.'}</div></div>`;
    return;
  }

  el.innerHTML = agents.map(a => {
    const rt = RUNTIME_INFO[a.runtime] || RUNTIME_INFO.planned;
    const pct = a.progress || 0;
    return `
    <div class="agent-card ${STATE.activeAgent===a.id?'selected':''}" style="--agent-col:${a.color}" onclick="showDetail('${a.id}')">
      <div class="agent-card-accent"></div>
      <div class="agent-card-main">
        <div class="agent-emoji">${a.emoji}</div>
        <div class="agent-info">
          <div class="agent-id-row">
            <span class="agent-id">AGENT-${a.id}</span>
            <span class="dep-badge ${rt.cls}">${rt.icon} ${rt.label}</span>
          </div>
          <div class="agent-name">${esc(a.name)}</div>
          <div class="agent-role">${esc(a.role)}</div>
          <div class="agent-desc">${esc(a.desc)}</div>
          <div class="agent-meta">
            <span class="meta-chip"><span class="dot" style="background:${a.color}"></span>${esc(a.promptPath||'—')}</span>
          </div>
          <div class="tag-row">${(a.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
        </div>
        <div class="agent-card-actions">
          <button class="btn xs" onclick="showDetail('${a.id}');event.stopPropagation()">Details</button>
          <button class="btn xs" onclick="cycleRuntime('${a.id}');event.stopPropagation()" title="Runtime wechseln">⟳</button>
          <button class="btn xs danger" onclick="removeFromTeam('${a.id}');event.stopPropagation()" title="Aus Team entfernen">✕</button>
        </div>
      </div>
      <div class="agent-footer">
        <div class="progress-row">
          <span class="progress-label">Deployment</span>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${a.color}"></div></div>
          <span class="progress-pct">${pct}%</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function closeDetail() {

// ═══════════════════════════════════════════════════════
// STATS BAR

// ═══════════════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════════════
function cycleRuntime(id) {
  const a = AGENTS.find(x=>x.id===id);
  if (!a) return;
  const order = ['planned','local','n8n'];
  const next = order[(order.indexOf(a.runtime)+1)%order.length];
  a.runtime = next;
  a.progress = {planned:20, local:40, n8n:100}[next];
  save(); renderAll();
  toast(`${a.emoji} ${a.name} → ${RUNTIME_INFO[next].label}`, 'blue');
}

function removeFromTeam(agentId) {
  const team = TEAMS.find(t=>t.id===STATE.activeTeam);
  if (!team) return;
  const a = AGENTS.find(x=>x.id===agentId);
  team.agents = team.agents.filter(id=>id!==agentId);
  save(); renderAll();
  toast(`${a?.emoji||''} Aus Team entfernt`, 'yellow');
}

async function deployToN8n(id) {
  const a = AGENTS.find(x=>x.id===id);
  if (!a) return;
  toast(`⚡ Deploy ${a.name} → n8n gestartet…`, 'blue');
  await delay(1800);
  a.runtime = 'n8n'; a.progress = 100;
  save(); renderAll(); showDetail(id);
  toast(`✅ ${a.name} auf n8n deployed!`, 'green');
}

function deleteAgent(id) {
  const a = AGENTS.find(x=>x.id===id);
  if (!a) return;
  if (!confirm(`Agent "${a.name}" wirklich löschen?`)) return;
  AGENTS = AGENTS.filter(x=>x.id!==id);
  TEAMS.forEach(t => t.agents = t.agents.filter(aid=>aid!==id));
  closeDetail();
  save(); renderAll();
  toast(`🗑️ ${a.name} gelöscht`, 'red');
}

function editAgent(id) {
  toast('Agent bearbeiten — in Kürze verfügbar', 'yellow');
}

function toggleStep(agentId, stepIdx) {
  // Visual only — step toggling in detail panel
  toast('Schritt-Tracking kommt in V3', 'blue');
}

// ═══════════════════════════════════════════════════════
// MODALS
// ═══════════════════════════════════════════════════════
function openNewTeamModal() {
  STATE.editTeamId = null;
  document.getElementById('team-modal-title').textContent = 'Team erstellen';
  document.getElementById('t-name').value = '';
  document.getElementById('t-desc').value = '';
  document.getElementById('t-color').value = '#3b82f6';
  document.getElementById('t-runtime').value = 'n8n';
  document.querySelectorAll('.color-opt').forEach(el=>el.style.border='3px solid transparent');
  document.querySelector('.color-opt[data-col="#3b82f6"]').style.border='3px solid white';
  document.getElementById('modal-team').hidden = false;
}

function pickColor(el) {
  document.querySelectorAll('.color-opt').forEach(e=>e.style.border='3px solid transparent');
  el.style.border='3px solid white';
  document.getElementById('t-color').value = el.dataset.col;
  STATE.selectedColor = el.dataset.col;
}

function saveTeam() {
  const name = document.getElementById('t-name').value.trim();
  const desc = document.getElementById('t-desc').value.trim();
  const color = document.getElementById('t-color').value;
  const runtime = document.getElementById('t-runtime').value;
  if (!name) { toast('Name ist Pflicht', 'red'); return; }

  if (STATE.editTeamId) {
    const t = TEAMS.find(x=>x.id===STATE.editTeamId);
    if (t) { t.name=name; t.desc=desc; t.color=color; t.runtime=runtime; }
  } else {
    const id = name.toLowerCase().replace(/[^a-z0-9-]/g,'-');
    TEAMS.push({ id, name, desc, color, runtime, agents:[] });
  }
  closeModal('modal-team');
  save(); renderAll();
  toast(`✅ Team "${name}" gespeichert`, 'green');
}

function openAddAgentModal() {
  document.getElementById('a-id').value='';
  document.getElementById('a-emoji').value='🤖';
  document.getElementById('a-name').value='';
  document.getElementById('a-role').value='';
  document.getElementById('a-desc').value='';
  document.getElementById('a-runtime').value='planned';
  document.getElementById('a-prompt-path').value='';
  document.getElementById('a-tags').value='';
  document.getElementById('modal-agent').hidden = false;
}

function saveAgent() {
  const id = document.getElementById('a-id').value.trim() || Date.now().toString(36);
  const name = document.getElementById('a-name').value.trim();
  if (!name) { toast('Name ist Pflicht', 'red'); return; }
  const runtime = document.getElementById('a-runtime').value;
  const tags = document.getElementById('a-tags').value.split(',').map(s=>s.trim()).filter(Boolean);
  const agent = {
    id,
    key: name.replace(/\s+/g,'-'),
    name,
    emoji: document.getElementById('a-emoji').value || '🤖',
    role: document.getElementById('a-role').value,
    desc: document.getElementById('a-desc').value,
    color: '#' + Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0'),
    runtime,
    promptPath: document.getElementById('a-prompt-path').value,
    tags,
    progress: {planned:0,local:40,n8n:100}[runtime]||0
  };
  AGENTS.push(agent);
  closeModal('modal-agent');
  save(); renderAll();
  toast(`✅ Agent "${name}" angelegt`, 'green');
}

function openAssignModal() {
  const team = TEAMS.find(t=>t.id===STATE.activeTeam);
  if (!team) { toast('Erst Team auswählen','yellow'); return; }
  document.getElementById('assign-modal-title').textContent = `Agenten für "${team.name}"`;
  document.getElementById('assign-checklist').innerHTML = AGENTS.map(a => `
    <label class="check-item">
      <input type="checkbox" value="${a.id}" ${team.agents.includes(a.id)?'checked':''}>
      <span style="font-size:18px;">${a.emoji}</span>
      <span>
        <span style="font-weight:500;">${esc(a.name)}</span>
        <span style="color:var(--fg3);font-size:11px;margin-left:6px;">${esc(a.role)}</span>
      </span>
      <span class="dep-badge ${(RUNTIME_INFO[a.runtime]||RUNTIME_INFO.planned).cls}" style="margin-left:auto;font-size:10px;">${a.runtime}</span>
    </label>
  `).join('');
  document.getElementById('modal-assign').hidden = false;
}

function saveAssignment() {
  const team = TEAMS.find(t=>t.id===STATE.activeTeam);
  if (!team) return;
  const checked = [...document.querySelectorAll('#assign-checklist input:checked')].map(i=>i.value);
  team.agents = checked;
  closeModal('modal-assign');
  save(); renderAll();
  toast(`✅ ${checked.length} Agenten zugewiesen`, 'green');
}

function closeModal(id) { document.getElementById(id).hidden = true; }

// ═══════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════
function renderAll() { renderTeams(); renderAgents(); renderStats(); }

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function delay(ms) { return new Promise(r=>setTimeout(r,ms)); }

function toast(msg, type='blue') {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className='toast';
  const cols = {green:'var(--green)',red:'var(--red)',yellow:'var(--yellow)',blue:'var(--accent2)'};
  t.innerHTML = `<span style="color:${cols[type]||cols.blue}">●</span> ${esc(msg)}`;
  c.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 3000);
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='light'?'dark':cur==='dark'?'':'light';
  document.documentElement.setAttribute('data-theme',next||'');
  try { localStorage.setItem('npch_theme',next); } catch(e) {}
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
(function init() {
  try {
    const t = localStorage.getItem('npch_theme');
    if (t) document.documentElement.setAttribute('data-theme',t);
  } catch(e) {}
  renderAll();
  // Auto-select dev-1 team
  selectTeam('dev-1');
})();
</script>
